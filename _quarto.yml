project:
  type: book
  output-dir: docs

format:
  html:
    toc: true
    theme: 
      light: cosmo
      dark: darkly
  pdf:
    documentclass: scrreprt
    pdf-engine: pdflatex
    mathspec: true
    include-in-header:
      - "latex-header.tex"

execute:
  freeze: auto
  keep-md: false

resources:
  - CNAME

book:
  title: "Discrete Choice Model Estimation with R"
  author: 
    - name: "Dan Yavorsky"
      orcid: 0000-0003-4095-6405
      email: dyavorsky@gmail.com
  #date: last-modified
  site-url: dcme-r.danyavorsky.com
  repo-url: https://github.com/dyavorsky/dcme-r
  repo-actions: edit
  bread-crumbs: true
  downloads: [pdf]

  sidebar:
    search: true
    style: "docked"
    border: true

  chapters:
    - index.qmd

    - part: "Foundations"
      chapters:
      - chapters/01_choice.qmd
      - chapters/02_draws.qmd
      - chapters/03_simdata.qmd
      - chapters/04_data.qmd
      - chapters/05_likelihood.qmd
      - chapters/06_optimization.qmd

    - part: "The MNL Family, by Likelihood"
      chapters:
      - chapters/07_mnl.qmd
      - chapters/08_mnl_mle.qmd
      - chapters/09_performance.qmd
      - chapters/10_iia.qmd
      - chapters/11_latentclass.qmd
      - chapters/12_msl.qmd
      - chapters/13_mixed_msl.qmd
      - chapters/14_limits.qmd

    - part: "The MNL Family, by Bayes"
      chapters:
      - chapters/15_bayes_mnl.qmd
      - chapters/16_gibbs.qmd
      - chapters/17_hb_mnl.qmd

    - part: "Beyond Logit: The Multinomial Probit"
      chapters:
      - chapters/18_mnp.qmd
      - chapters/19_mnp_estimation.qmd
      - chapters/20_hb_mnp.qmd

    - part: "Using and Extending the Models"
      chapters:
      - chapters/21_postestimation.qmd
      - chapters/22_extensions.qmd

    - chapters/references.qmd

  appendices:
   - chapters/appendix.qmd

bibliography: references.bib



